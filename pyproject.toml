[project]
name = "storycg"
version = "0.1.0"
description = "Persisted single-shot ComfyUI generation for story CG"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "pillow>=11,<13",
  "ultralytics>=8.3,<9",
  "torch>=2.6",
  "torchvision>=0.21",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storycg"]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest-tmp"

[tool.uv]
cache-dir = ".uv-cache"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
